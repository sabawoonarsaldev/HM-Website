<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel | HM Trading Company</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
</head>
<body data-noslider>
<header id="navbar" class="navbar"></header>

<main class="page">
  <div class="atabs" id="tabs">
    <button data-t="dashboard">Dashboard</button>
    <button data-t="products">Products</button>
    <button data-t="categories">Categories</button>
    <button data-t="users">Users</button>
    <button data-t="company">Company</button>
  </div>
  <div id="content"></div>
</main>

<footer id="footer"></footer>

<script>
  if (!Auth.isAdmin()) location.replace('/login.html');

  const $ = id => document.getElementById(id);
  const main = $('content');
  let cats = [];

  function toast(t, err) {
    const d = document.createElement('div');
    d.className = 'toast' + (err ? ' err' : '');
    d.textContent = t;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2800);
  }
  async function run(fn) { try { await fn(); } catch (e) { toast(e.message, true); } }

  function openModal(html) {
    closeModal();
    const bg = document.createElement('div');
    bg.className = 'modal-bg'; bg.id = 'modalBg';
    bg.innerHTML = `<div class="modal">${html}</div>`;
    bg.addEventListener('mousedown', e => { if (e.target === bg) closeModal(); });
    document.body.appendChild(bg);
  }
  function closeModal() { const m = $('modalBg'); if (m) m.remove(); }

  /* ---------- Tabs ---------- */
  const views = { dashboard, products, categories, users, company };
    function setTab(name) {
    if (!views[name]) name = 'dashboard';
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === name));
    history.replaceState(null, '', '#' + name);
    main.innerHTML = '<div class="empty">Loading...</div>';
    run(views[name]);
  }
  $('tabs').onclick = e => { if (e.target.dataset.t) setTab(e.target.dataset.t); };

  /* ---------- Dashboard ---------- */
  const statCard = (label, n, ic) =>
    `<div class="stat-card"><div class="info-ic">${icon(ic)}</div><div><b>${n}</b><span>${label}</span></div></div>`;


      async function dashboard() {
    const [p, u, c] = await Promise.all([
      api('/api/products?limit=6'), api('/api/users'), api('/api/categories')
    ]);
    main.innerHTML = `
      <div class="stats">
        ${statCard('Products', p.total, 'box')}
        ${statCard('Categories', c.length, 'tag')}
        ${statCard('Users', u.length, 'users')}
      </div>
      <div class="bar"><h2>Latest Products</h2><button class="btn" onclick="setTab('products')">Manage Products</button></div>
      <div class="grid">${p.products.length ? p.products.map(card).join('') : emptyBox('No products yet.')}</div>`;
  }
  
  /* ---------- Products ---------- */
  async function products() {
    const { products: list } = await api('/api/products?limit=100');
    main.innerHTML = `
      <div class="bar"><h2>Products (${list.length})</h2><button class="btn" onclick="productForm()">+ Add Product</button></div>
      <div class="table-wrap"><table class="table">
        <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th></th></tr></thead>
        <tbody>${list.map(p => `
          <tr>
            <td><img class="thumb" src="${imgUrl(p.image)}" alt=""></td>
            <td><b>${esc(p.name)}</b></td>
            <td>${esc(p.category_name || '-')}</td>
            <td>${money(p.price)}</td>
            <td><div class="act">
              <button class="btn-sm" onclick="productForm(${p.id})">Edit</button>
              <button class="btn-sm danger" onclick="delProduct(${p.id})">Delete</button>
            </div></td>
          </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">No products yet.</td></tr>'}
        </tbody></table></div>`;
  }

  function delProduct(id) {
    if (!confirm('Delete this product?')) return;
    run(async () => { await api('/api/products/' + id, { method: 'DELETE' }); toast('Product deleted'); products(); });
  }

    /* ---------- آپلود مستقیم به Cloudinary (با نوار loading) ---------- */
  const MAX_MB = 5, OK_TYPES = ['image/jpeg', 'image/png', 'image/webp'];

  function checkFile(f) {
    if (!OK_TYPES.includes(f.type)) throw new Error(`"${f.name}": only JPG, PNG or WEBP images are allowed.`);
    if (f.size > MAX_MB * 1024 * 1024) throw new Error(`"${f.name}": file is larger than ${MAX_MB}MB.`);
  }

  // یک عکس را مستقیم به Cloudinary می‌فرستد و پیشرفت را گزارش می‌دهد
  function uploadToCloud(file, sig, onProgress) {
    return new Promise((resolve, reject) => {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('api_key', sig.apiKey);
      fd.append('timestamp', sig.timestamp);
      fd.append('signature', sig.signature);
      fd.append('folder', sig.folder);
      fd.append('allowed_formats', sig.allowedFormats);
      fd.append('transformation', sig.transformation);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', `https://api.cloudinary.com/v1_1/${sig.cloudName}/image/upload`);
      xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let r = {};
        try { r = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status === 200 && r.secure_url) resolve({ url: r.secure_url, publicId: r.public_id });
        else reject(new Error((r.error && r.error.message) || 'Image upload failed.'));
      };
      xhr.onerror = () => reject(new Error('Network error during image upload.'));
      xhr.send(fd);
    });
  }

  // چند عکس را به ترتیب آپلود می‌کند و نوار پیشرفت کلی را نشان می‌دهد
  async function uploadAll(files, setStatus) {
    const out = [];
    for (let i = 0; i < files.length; i++) {
      const sig = await api('/api/uploads/sign');        // امضای تازه برای هر عکس
      const r = await uploadToCloud(files[i], sig, p => setStatus(i, files.length, p));
      out.push(r);
    }
    return out;
  }

  function productForm(id) {
    run(async () => {
      cats = await api('/api/categories');
      let p = { images: [] };
      if (id) p = await api('/api/products/' + id);

      openModal(`
        <h3>${id ? 'Edit Product' : 'Add New Product'}</h3>
        <div class="form-grid">
          <div class="field"><label>Name *</label><input id="f_name" value="${esc(p.name)}"></div>
          <div class="field"><label>Price (USD) *</label><input id="f_price" type="number" step="0.01" value="${esc(p.price)}"></div>
          <div class="field"><label>Category</label>
            <select id="f_cat"><option value="">— None —</option>
              ${cats.map(c => `<option value="${c.id}" ${c.id === p.category_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
            </select></div>
          <div class="field"><label>Short description</label><input id="f_short" maxlength="255" value="${esc(p.short_desc)}"></div>
          <div class="field full"><label>Description</label><textarea id="f_desc" rows="4">${esc(p.description)}</textarea></div>
          <div class="field full"><label>Specifications (one per line, like: RAM: 8GB)</label><textarea id="f_specs" rows="5">${esc(p.specs)}</textarea></div>
          <div class="field"><label>Main image</label><input id="f_image" type="file" accept="image/*">
            ${p.image ? `<img class="thumb" style="margin-top:8px" src="${imgUrl(p.image)}" alt="">` : ''}</div>
          <div class="field"><label>Gallery images (multiple)</label><input id="f_gallery" type="file" accept="image/*" multiple></div>
          ${p.images.length ? `<div class="field full"><label>Current gallery</label><div class="thumbs">
            ${p.images.map(g => `<div class="gimg"><img src="${imgUrl(g.image)}" alt="">
              <button type="button" onclick="delGallery(${id},${g.id},this)">×</button></div>`).join('')}</div></div>` : ''}
        </div>
                <div id="f_bar" class="up-bar" style="display:none">
          <div id="f_label" class="up-label">Uploading…</div>
          <div class="up-track"><div id="f_barin" class="up-fill"></div></div>
        </div>
        <div class="modal-foot">
          <button class="btn-sm" onclick="closeModal()">Cancel</button>
          <button class="btn" id="f_save" onclick="saveProduct(${id || 0})">Save</button>
        </div>`);
    });
  }

  function delGallery(pid, imgId, btn) {
    run(async () => {
      await api(`/api/products/${pid}/images/${imgId}`, { method: 'DELETE' });
      btn.parentElement.remove();
      toast('Image removed');
    });
  }

  function saveProduct(id) {
    run(async () => {
      if (!$('f_name').value.trim() || !$('f_price').value) throw new Error('Name and price are required.');

      const mainFile = $('f_image').files[0];
      const galleryFiles = [...$('f_gallery').files];
      const all = [...(mainFile ? [mainFile] : []), ...galleryFiles];
      all.forEach(checkFile);
      if (galleryFiles.length > 6) throw new Error('Maximum 6 gallery images.');

      const btn = $('f_save'), bar = $('f_bar'), barIn = $('f_barin'), label = $('f_label');
      btn.disabled = true;
      bar.style.display = 'block';

      const setStatus = (i, n, p) => {
        const pct = Math.round(((i + p) / n) * 100);
        barIn.style.width = pct + '%';
        label.textContent = `Uploading image ${i + 1} of ${n}… ${pct}%`;
      };

      try {
        let up = [];
        if (all.length) up = await uploadAll(all, setStatus);

        label.textContent = 'Saving product…';
        barIn.style.width = '100%';

        const main = mainFile ? up[0] : null;
        const gallery = mainFile ? up.slice(1) : up;

        await api(id ? '/api/products/' + id : '/api/products', {
          method: id ? 'PUT' : 'POST',
          ...json({
            name: $('f_name').value, price: $('f_price').value, category_id: $('f_cat').value,
            short_desc: $('f_short').value, description: $('f_desc').value, specs: $('f_specs').value,
            image: main, gallery
          })
        });
      } catch (e) {
        btn.disabled = false;
        bar.style.display = 'none';
        throw e;
      }
      closeModal();
      toast(id ? 'Product updated' : 'Product added');
      products();
    });
  }

  /* ---------- Categories ---------- */
  async function categories() {
    const list = await api('/api/categories');
    main.innerHTML = `
      <div class="bar"><h2>Categories (${list.length})</h2></div>
      <div class="inline-form">
        <div class="field"><label>New category name</label><input id="c_name" placeholder="e.g. Smart Watches"></div>
        <button class="btn" onclick="addCategory()">+ Add</button>
      </div>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Name</th><th>Products</th><th></th></tr></thead>
        <tbody>${list.map(c => `
          <tr><td><b>${esc(c.name)}</b></td><td>${c.product_count}</td>
          <td><div class="act"><button class="btn-sm danger" onclick="delCategory(${c.id})">Delete</button></div></td></tr>`).join('')}
        </tbody></table></div>`;
  }
  function addCategory() {
    run(async () => {
      await api('/api/categories', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: $('c_name').value })
      });
      toast('Category added'); categories();
    });
  }
  function delCategory(id) {
    if (!confirm('Delete this category? Its products will stay but have no category.')) return;
    run(async () => { await api('/api/categories/' + id, { method: 'DELETE' }); toast('Category deleted'); categories(); });
  }

  /* ---------- Users ---------- */
  async function users() {
    const list = await api('/api/users');
    const me = Auth.user().id;
    main.innerHTML = `
      <div class="bar"><h2>Users (${list.length})</h2></div>
      <div class="inline-form">
        <div class="field"><label>Full name</label><input id="u_name"></div>
        <div class="field"><label>Email</label><input id="u_email" type="email"></div>
        <div class="field"><label>Password</label><input id="u_pass" type="password" placeholder="min 6 characters"></div>
        <div class="field"><label>Role</label><select id="u_role"><option value="user">User</option><option value="admin">Admin</option></select></div>
        <button class="btn" onclick="addUser()">+ Create User</button>
      </div>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th></th></tr></thead>
        <tbody>${list.map(x => `
          <tr>
            <td><b>${esc(x.full_name)}</b></td><td>${esc(x.email)}</td>
            <td><span class="role ${x.role}">${x.role}</span></td>
            <td>${new Date(x.created_at).toLocaleDateString()}</td>
                       <td><div class="act">
              ${x.id === me
                ? `<small style="color:var(--muted)">You</small>
                   <button class="btn-sm" onclick="editMe()">Edit My Profile</button>`
                : `<button class="btn-sm" onclick="toggleRole(${x.id},'${x.role === 'admin' ? 'user' : 'admin'}')">Make ${x.role === 'admin' ? 'User' : 'Admin'}</button>
                   <button class="btn-sm" onclick="resetPass(${x.id})">Reset Password</button>
                   <button class="btn-sm danger" onclick="delUser(${x.id})">Delete</button>`}
            </div></td>
          </tr>`).join('')}
        </tbody></table></div>`;
  }
  const json = o => ({ headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o) });
  function addUser() {
    run(async () => {
      await api('/api/users', { method: 'POST', ...json({
        full_name: $('u_name').value, email: $('u_email').value, password: $('u_pass').value, role: $('u_role').value
      }) });
      toast('User created'); users();
    });
  }
  function toggleRole(id, role) {
    run(async () => { await api('/api/users/' + id, { method: 'PUT', ...json({ role }) }); toast('Role updated'); users(); });
  }
  function resetPass(id) {
    const password = prompt('Enter a new password (min 6 characters):');
    if (!password) return;
    run(async () => { await api('/api/users/' + id, { method: 'PUT', ...json({ password }) }); toast('Password changed'); });
  }
  function delUser(id) {
    if (!confirm('Delete this user?')) return;
    run(async () => { await api('/api/users/' + id, { method: 'DELETE' }); toast('User deleted'); users(); });
  }

    function editMe() {
    const u = Auth.user();
    openModal(`
      <h3>Edit My Profile</h3>
      <div class="field"><label>Full name</label><input id="m_name" value="${esc(u.name)}"></div>
      <div class="field"><label>Email (used to login)</label><input id="m_email" type="email" value="${esc(u.email)}"></div>
      <div class="field"><label>New password (leave empty to keep current)</label><input id="m_pass" type="password" placeholder="min 6 characters"></div>
      <div class="modal-foot">
        <button class="btn-sm" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="saveMe()">Save</button>
      </div>`);
  }

  function saveMe() {
    run(async () => {
      const r = await api('/api/users/me/profile', { method: 'PUT', ...json({
        full_name: $('m_name').value, email: $('m_email').value, password: $('m_pass').value
      }) });
      Auth.save(r.token, r.user);
      closeModal(); toast('Profile updated'); users();
    });
  }




    /* ---------- Company (معلومات شرکت) ---------- */
  let SITE = null;

  async function company() {
    SITE = await api('/api/site');
    const s = SITE.settings || {};
    main.innerHTML = `
      <!-- معلومات عمومی -->
      <div class="bar"><h2>Company Information</h2></div>
      <div class="panel" style="margin-bottom:34px">
        <div class="form-grid">
          <div class="field"><label>Email</label><input id="s_email" type="email" value="${esc(s.email || COMPANY.email)}"></div>
          <div class="field"><label>Working hours</label><input id="s_hours" value="${esc(s.hours || COMPANY.hours)}"></div>
          <div class="field full"><label>Address</label><input id="s_addr" value="${esc(s.address || COMPANY.address)}"></div>
          <div class="field"><label>Manager name (Management)</label><input id="s_owner" value="${esc(s.owner_name || COMPANY.owner)}"></div>
          <div class="field"><label>Manager title</label><input id="s_otitle" value="${esc(s.owner_title || COMPANY.ownerTitle)}"></div>
        </div>
        <button class="btn" onclick="saveSettings()">Save Changes</button>
      </div>

      <!-- شماره‌ها -->
      <div class="bar"><h2>Phone / WhatsApp Numbers (${SITE.phones.length})</h2></div>
      <div class="inline-form">
        <div class="field"><label>Label</label><input id="p_label" placeholder="e.g. Sales"></div>
        <div class="field"><label>Phone number</label><input id="p_num" placeholder="e.g. 0749296060"></div>
        <button class="btn" onclick="addPhone()">+ Add</button>
      </div>
      <div class="table-wrap" style="margin-bottom:34px"><table class="table">
        <thead><tr><th>Label</th><th>Number</th><th>WhatsApp</th><th></th></tr></thead>
        <tbody>${SITE.phones.map(p => `
          <tr><td><b>${esc(p.label)}</b></td><td>${esc(p.number)}</td><td>+${esc(p.wa)}</td>
          <td><div class="act">
            <button class="btn-sm" onclick="editPhone(${p.id})">Edit</button>
            <button class="btn-sm danger" onclick="delItem('phones',${p.id})">Delete</button>
          </div></td></tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">No numbers yet.</td></tr>'}
        </tbody></table></div>

      <!-- شعبه‌ها -->
      <div class="bar"><h2>Branches &amp; Agencies (${SITE.branches.length})</h2></div>
      <div class="inline-form">
        <div class="field"><label>Branch name *</label><input id="b_name"></div>
        <div class="field"><label>Address *</label><input id="b_addr"></div>
        <div class="field"><label>Phone *</label><input id="b_phone"></div>
        <div class="field"><label>Manager *</label><input id="b_mgr"></div>
        <button class="btn" onclick="addBranch()">+ Add Branch</button>
      </div>
      <div class="table-wrap" style="margin-bottom:34px"><table class="table">
        <thead><tr><th>Branch</th><th>Address</th><th>Phone</th><th>Manager</th><th></th></tr></thead>
        <tbody>${SITE.branches.map(b => `
          <tr><td><b>${esc(b.name)}</b></td><td>${esc(b.address)}</td><td>${esc(b.phone)}</td><td>${esc(b.manager)}</td>
          <td><div class="act">
            <button class="btn-sm" onclick="editBranch(${b.id})">Edit</button>
            <button class="btn-sm danger" onclick="delItem('branches',${b.id})">Delete</button>
          </div></td></tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">No branches yet.</td></tr>'}
        </tbody></table></div>

      <!-- برندها -->
      <div class="bar"><h2>Our Brands (${SITE.brands.length})</h2></div>
      <div class="inline-form">
        <div class="field"><label>Brand name</label><input id="br_name" placeholder="e.g. HM Mobile"></div>
        <button class="btn" onclick="addBrand()">+ Add</button>
      </div>
      <div class="tag-list">${SITE.brands.map(b => `
        <span class="tag">${esc(b.name)}<button onclick="delItem('brands',${b.id})" aria-label="Delete">×</button></span>`).join('')
        || '<span style="color:var(--muted)">No brands yet.</span>'}</div>

      <p style="color:var(--muted);margin-top:30px;font-size:14px">
        “What We Offer” in the About page comes automatically from the <b>Categories</b> tab.</p>`;
  }

  function saveSettings() {
    run(async () => {
      await api('/api/site/settings', { method: 'PUT', ...json({
        email: $('s_email').value, hours: $('s_hours').value, address: $('s_addr').value,
        owner_name: $('s_owner').value, owner_title: $('s_otitle').value
      }) });
      toast('Saved'); company();
    });
  }

  function addPhone() {
    run(async () => {
      await api('/api/site/phones', { method: 'POST', ...json({ label: $('p_label').value, number: $('p_num').value }) });
      toast('Number added'); company();
    });
  }
  function editPhone(id) {
    const p = SITE.phones.find(x => x.id === id);
    const label = prompt('Label:', p.label); if (label === null) return;
    const number = prompt('Phone number:', p.number); if (number === null) return;
    run(async () => {
      await api('/api/site/phones/' + id, { method: 'PUT', ...json({ label, number }) });
      toast('Number updated'); company();
    });
  }

  function addBranch() {
    run(async () => {
      await api('/api/site/branches', { method: 'POST', ...json({
        name: $('b_name').value, address: $('b_addr').value, phone: $('b_phone').value, manager: $('b_mgr').value
      }) });
      toast('Branch added'); company();
    });
  }
  function editBranch(id) {
    const b = SITE.branches.find(x => x.id === id);
    openModal(`
      <h3>Edit Branch</h3>
      <div class="form-grid">
        <div class="field"><label>Branch name *</label><input id="e_name" value="${esc(b.name)}"></div>
        <div class="field"><label>Phone *</label><input id="e_phone" value="${esc(b.phone)}"></div>
        <div class="field full"><label>Address *</label><input id="e_addr" value="${esc(b.address)}"></div>
        <div class="field full"><label>Manager *</label><input id="e_mgr" value="${esc(b.manager)}"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-sm" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="saveBranch(${id})">Save</button>
      </div>`);
  }
  function saveBranch(id) {
    run(async () => {
      await api('/api/site/branches/' + id, { method: 'PUT', ...json({
        name: $('e_name').value, address: $('e_addr').value, phone: $('e_phone').value, manager: $('e_mgr').value
      }) });
      closeModal(); toast('Branch updated'); company();
    });
  }

  function addBrand() {
    run(async () => {
      await api('/api/site/brands', { method: 'POST', ...json({ name: $('br_name').value }) });
      toast('Brand added'); company();
    });
  }

  function delItem(type, id) {
    if (!confirm('Delete this item?')) return;
    run(async () => { await api(`/api/site/${type}/${id}`, { method: 'DELETE' }); toast('Deleted'); company(); });
  }


  setTab(location.hash.slice(1) || 'dashboard');
</script>
</body>
</html>
