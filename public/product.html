<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | HM Trading Company</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
</head>
<body data-noslider>
<header id="navbar" class="navbar"></header>

<main class="page" id="page"><div class="empty">Loading...</div></main>

<footer id="footer"></footer>

<script>
  const id = Number(new URLSearchParams(location.search).get('id')) || 0;
  (async () => {
    const page = document.getElementById('page');
    try {
      const p = await api('/api/products/' + id);
      document.title = p.name + ' | HM Trading Company';
      const pics = [p.image, ...p.images.map(x => x.image)].filter(Boolean);

      page.innerHTML = `
        <div class="crumbs"><a href="/index.html">Home</a> / <a href="/products.html">Products</a> / ${esc(p.name)}</div>

        <div class="detail">
          <div>
            <div class="gallery-main"><img id="mainImg" src="${imgUrl(pics[0])}" alt="${esc(p.name)}"></div>
            ${pics.length > 1 ? `<div class="thumbs" id="thumbs">${pics.map((f, k) =>
              `<img src="${imgUrl(f)}" class="${k === 0 ? 'on' : ''}" alt="">`).join('')}</div>` : ''}
          </div>
          <div class="info">
            ${p.category_name ? `<span class="badge">${esc(p.category_name)}</span>` : ''}
            <h1>${esc(p.name)}</h1>
            <div class="price">${money(p.price)}</div>
            <p class="short">${esc(p.short_desc || '')}</p>
            <a class="btn" href="/contact.html?product=${encodeURIComponent(p.name)}">Contact us about this product</a>
            ${p.description ? `<div class="block"><h3>Description</h3><p>${esc(p.description)}</p></div>` : ''}
            ${specsTable(p.specs)}
          </div>
        </div>

        <div class="comments comments-page" id="comments"></div>

        <div class="section-head" style="margin-top:50px"><h2>More Products</h2><a href="/products.html">View all →</a></div>
        <div class="grid" id="related"></div>`;

      const thumbs = document.getElementById('thumbs');
      if (thumbs) thumbs.onclick = e => {
        if (e.target.tagName !== 'IMG') return;
        document.getElementById('mainImg').src = e.target.src;
        thumbs.querySelectorAll('img').forEach(i => i.classList.toggle('on', i === e.target));
      };

      loadComments(id);

      // محصولات مشابه
      const qs = p.category_id ? `&category=${p.category_id}` : '';
      const { products } = await api(`/api/products?limit=7${qs}`);
      const others = products.filter(x => String(x.id) !== String(id)).slice(0, 3);
      document.getElementById('related').innerHTML = others.length ? others.map(card).join('') : emptyBox('No other products yet.');
    } catch (e) {
      page.innerHTML = emptyBox(esc(e.message));
    }
  })();
</script>
</body>
</html>
