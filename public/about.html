<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About Us | HM Trading Company</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
</head>
<body>
<header id="navbar" class="navbar"></header>
<div id="sliderMount"></div>
<main class="page" id="page"></main>
<footer id="footer"></footer>

<script>
  siteReady.then(() => {
    const C = COMPANY;
    const wa = p => `https://wa.me/${p.wa}`;
    document.getElementById('page').innerHTML = `
      <section class="hero-about">
        <span class="badge" style="background:var(--mint)">Since ${C.founded}</span>
        <h1>About ${esc(C.name)}</h1>
        <p>${esc(C.about)}</p>
      </section>

      <div class="stats4">${C.stats.map(s => `<div class="stat"><b>${esc(s.n)}</b><span>${esc(s.t)}</span></div>`).join('')}</div>

      <div class="two">
        <div class="panel"><h3>Our Mission</h3><p>${esc(C.mission)}</p></div>
        <div class="panel"><h3>Our Vision</h3><p>${esc(C.vision)}</p></div>
      </div>

      <h2 class="h-title">Our History</h2>
      <div class="timeline">${C.history.map(h => `
        <div class="t-item"><b>${esc(h.year)}</b><h4>${esc(h.title)}</h4><p>${esc(h.text)}</p></div>`).join('')}</div>

      <h2 class="h-title">Why Choose Us</h2>
      <div class="feat">${C.features.map(f => `<div class="panel"><h3>${esc(f.t)}</h3><p>${esc(f.d)}</p></div>`).join('')}</div>

      <h2 class="h-title">What We Offer</h2>
      <div class="brands" id="cats"></div>

      ${C.brands.length ? `<h2 class="h-title">Our Brands</h2>
        <div class="brands">${C.brands.map(b => `<span>${esc(b)}</span>`).join('')}</div>` : ''}

      ${C.branches.length ? `<h2 class="h-title">Branches &amp; Agencies</h2>
        <div class="cards3">${C.branches.map(b => `
          <div class="panel">
            <h3>${esc(b.city)}</h3>
            <p>${icon('pin')} ${esc(b.address)}</p>
            <p>${icon('phone')} ${esc(b.phone)}</p>
            <p>${icon('users')} Manager: ${esc(b.manager)}</p>
          </div>`).join('')}</div>` : ''}

      ${C.gallery.length ? `<h2 class="h-title">Gallery</h2><div class="gal">${C.gallery.map(g => `<img loading="lazy" src="${esc(g)}" alt="">`).join('')}</div>` : ''}

      <h2 class="h-title">Management</h2>
      <div class="panel owner">
        <div class="avatar">${esc((C.owner || 'M')[0])}</div>
        <div><h3>${esc(C.owner)}</h3><p>${esc(C.ownerTitle)}</p></div>
      </div>

      <h2 class="h-title" style="margin-top:50px">Get in Touch</h2>
      <div class="cards3">
        <div class="panel"><h3>Phone / WhatsApp</h3>
          ${C.phones.map(p => `<p>${icon('phone')} <a href="${wa(p)}" target="_blank">${esc(p.label)}: ${esc(p.display)}</a></p>`).join('')}
        </div>
        <div class="panel"><h3>Email</h3><p>${icon('mail')} <a href="mailto:${esc(C.email)}">${esc(C.email)}</a></p></div>
        <div class="panel"><h3>Address</h3><p>${icon('pin')} ${esc(C.address)}</p><p>${icon('clock')} ${esc(C.hours)}</p></div>
      </div>
      <div style="text-align:center"><a class="btn" href="/contact.html">Contact Us</a></div>`;

    api('/api/categories').then(cats => {
      document.getElementById('cats').innerHTML = cats.map(c =>
        `<a href="/products.html?category=${c.id}" class="chip" style="padding:14px 26px;font-size:15px">${esc(c.name)}</a>`).join('');
    }).catch(() => {});
  });
</script>
</body>
</html>
