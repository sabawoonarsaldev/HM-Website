<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | HM Trading Company</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
</head>
<body>
<header id="navbar" class="navbar"></header>
<div id="sliderMount"></div>

<main class="page">
  <div class="hero-about" style="padding-top:20px">
    <h1>Contact Us</h1>
    <p>Reach us directly by WhatsApp, phone or email. We reply as soon as possible.</p>
  </div>
  <div id="contactBox"></div>
</main>

<footer id="footer"></footer>

<script>
  siteReady.then(() => {
    const C = COMPANY;
    const product = new URLSearchParams(location.search).get('product');

    // پیام آماده به پشتو
    const waText = 'سلام، زه ستاسو د ویب‌سایټ له لارې درسره اړیکه نیسم.' +
      (product ? ` د «${product}» محصول په اړه معلومات غواړم.` : ' غواړم ستاسو د محصولاتو په اړه معلومات ترلاسه کړم.');
    const mailSubject = product ? `د ${product} په اړه پوښتنه` : 'د محصولاتو په اړه پوښتنه';
    const mailBody = 'سلام،\n\n' +
      (product ? `د «${product}» محصول په اړه معلومات غواړم.` : 'غواړم ستاسو د محصولاتو په اړه معلومات ترلاسه کړم.') +
      '\n\nمننه';

    const waIcon = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.38A9.93 9.93 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.45 1.33-2 1.4-.52.08-1.17.1-1.9-.12a17 17 0 0 1-1.72-.64c-3.03-1.3-5-4.35-5.15-4.55-.15-.2-1.23-1.63-1.23-3.1 0-1.48.77-2.2 1.05-2.5.27-.3.6-.37.8-.37h.58c.18 0 .43-.07.67.52.25.6.85 2.07.93 2.22.07.15.12.32.02.52-.1.2-.15.32-.3.5-.15.17-.32.38-.45.5-.15.15-.3.3-.13.6.17.3.77 1.27 1.65 2.05 1.13 1 2.08 1.32 2.38 1.47.3.15.47.12.65-.07.17-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.27.1 1.73.82 2.03.97.3.15.5.22.57.35.08.12.08.72-.17 1.4z"/></svg>';

    const phones = C.phones.map(p => `
      <div class="c-card">
        <div class="info-ic">${icon('phone')}</div>
        <h3>${esc(p.label)}</h3>
        <div class="c-val" dir="ltr">${esc(p.display)}</div>
        <div class="c-btns">
          <a class="btn btn-wa" target="_blank" rel="noopener"
             href="https://wa.me/${esc(p.wa)}?text=${encodeURIComponent(waText)}">${waIcon} WhatsApp</a>
          <a class="btn-sm" href="tel:+${esc(p.wa)}">${icon('phone')} Call</a>
        </div>
      </div>`).join('');

    const mail = `
      <div class="c-card">
        <div class="info-ic">${icon('mail')}</div>
        <h3>Email</h3>
        <div class="c-val" dir="ltr">${esc(C.email)}</div>
        <div class="c-btns">
          <a class="btn" href="mailto:${esc(C.email)}?subject=${encodeURIComponent(mailSubject)}&body=${encodeURIComponent(mailBody)}">${icon('mail')} Send Email</a>
        </div>
      </div>`;

    const addr = `
      <div class="c-card">
        <div class="info-ic">${icon('pin')}</div>
        <h3>Address</h3>
        <div class="c-val">${esc(C.address)}</div>
        <div class="c-val" style="margin-top:6px;font-size:14px;color:var(--muted)">${icon('clock')} ${esc(C.hours)}</div>
        <div class="c-btns">
          <a class="btn-sm" target="_blank" rel="noopener"
             href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(C.address)}">Open in Maps</a>
        </div>
      </div>`;

    document.getElementById('contactBox').innerHTML = `<div class="c-grid">${phones}${mail}${addr}</div>`;
  });
</script>
</body>
</html>
