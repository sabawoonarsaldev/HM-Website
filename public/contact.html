<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | HM Trading Company</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
</head>
<body>
<header id="navbar" class="navbar"></header>
<div id="sliderMount"></div>

<main class="page">
  <div class="hero-about" style="padding-top:20px">
    <h1>Contact Us</h1>
    <p>Have a question about a product or price? Send us a message and we will reply as soon as possible.</p>
  </div>

  <div class="contact-grid">
    <div class="panel" id="infoBox"></div>

    <div class="panel">
      <h3 style="margin-bottom:16px">Send us a message</h3>
      <div class="msg" id="msg"></div>
      <div class="row2">
        <div class="field"><label>Your Name *</label><input id="name"></div>
        <div class="field"><label>Your Phone</label><input id="phone" placeholder="+93..."></div>
      </div>
      <div class="field"><label>Your Email</label><input id="email" type="email"></div>
      <div class="field"><label>Send WhatsApp to</label><select id="waTo"></select></div>
      <div class="field"><label>Message *</label><textarea id="message" rows="5"></textarea></div>
      <button class="btn" id="send" style="width:100%">Send Message</button>
      <p style="color:var(--muted);font-size:13px;margin-top:10px;text-align:center">
        Your message will be sent by email and WhatsApp will open with the message ready to send.
      </p>
    </div>
  </div>
</main>

<footer id="footer"></footer>

<script>
  siteReady.then(() => {
    const $ = id => document.getElementById(id);
    const C = COMPANY;
    const u = Auth.user() || {};

    $('infoBox').innerHTML = `
      <h3 style="margin-bottom:6px">Contact Information</h3>
      ${C.phones.map(p => `
        <div class="info-item"><div class="info-ic">${icon('phone')}</div>
          <div><b>${esc(p.label)}</b><a href="tel:+${p.wa}">${esc(p.display)}</a>
          <a href="https://wa.me/${p.wa}" target="_blank" style="color:var(--green-dark)">Chat on WhatsApp</a></div></div>`).join('')}
      <div class="info-item"><div class="info-ic">${icon('mail')}</div>
        <div><b>Email</b><a href="mailto:${esc(C.email)}">${esc(C.email)}</a></div></div>
      <div class="info-item"><div class="info-ic">${icon('pin')}</div>
        <div><b>Address</b><span>${esc(C.address)}</span></div></div>
      <div class="info-item"><div class="info-ic">${icon('clock')}</div>
        <div><b>Working Hours</b><span>${esc(C.hours)}</span></div></div>`;

    $('waTo').innerHTML = C.phones.map((p, i) => `<option value="${i}">${esc(p.label)} (${esc(p.display)})</option>`).join('');
    $('name').value = u.name || '';
    $('email').value = u.email || '';
    const product = new URLSearchParams(location.search).get('product');
    if (product) $('message').value = `Hello, I am interested in "${product}". Please send me more information.`;

    const show = (t, ok) => { $('msg').textContent = t; $('msg').className = 'msg ' + (ok ? 'ok' : 'err'); };

    $('send').onclick = async () => {
      const name = $('name').value.trim(), message = $('message').value.trim();
      if (!name || !message) return show('Please enter your name and message.', false);

      const phone = C.phones[$('waTo').value];
      if (phone) {
        const text = `Hello, I am ${name}.\n${message}` +
          ($('phone').value ? `\nPhone: ${$('phone').value}` : '') +
          ($('email').value ? `\nEmail: ${$('email').value}` : '');
        window.open(`https://wa.me/${phone.wa}?text=${encodeURIComponent(text)}`, '_blank');
      }

      $('send').disabled = true;
      try {
        const r = await api('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email: $('email').value, phone: $('phone').value, message })
        });
        show(r.emailSent ? 'Thank you! Your message was sent by email and WhatsApp.' : 'Thank you! Your message was received.', true);
        $('message').value = '';
      } catch (e) { show(e.message, false); }
      $('send').disabled = false;
    };
  });
</script>
</body>
</html>
